[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tess-anomaly-research"
version = "0.1.0"
description = "Reproducible BLS and anomaly-ranking experiments on TESS photometry"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<3", "scipy>=1.12,<2", "matplotlib>=3.8,<4", "astropy>=6,<8", "lightkurve>=2.5,<3", "scikit-learn>=1.4,<2", "joblib>=1.3,<2", "PyYAML>=6,<7", "requests>=2.31,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9", "jupyter>=1,<2"]
autoencoder = ["torch>=2.2,<3"]

[project.scripts]
tess-anomaly = "tess_anomaly.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
